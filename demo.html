<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Profile Card</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Outer Container */
        .card-container {
            background: #ffffff;
            width: 100%;
            max-width: 380px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        /* Top Header Banner */
        .card-header {
            background-color: #0f172a;
            color: #ffffff;
            padding: 20px 16px;
            text-align: center;
        }

        .header-logo {
            width: 48px;
            height: 48px;
            margin: 0 auto 8px;
            background-color: #334155;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .header-title {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .header-subtitle {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 4px;
        }

        /* Card Body */
        .card-body {
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Profile Photo Container */
        .photo-wrapper {
            position: relative;
            margin-bottom: 16px;
        }

        .profile-photo {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #f8fafc;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            background-color: #e2e8f0;
        }

        .status-badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background-color: #10b981;
            color: #ffffff;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 9999px;
            border: 2px solid #ffffff;
            text-transform: uppercase;
        }

        .person-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 4px;
        }

        .person-role {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 20px;
        }

        /* Details Grid */
        .details-grid {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            background-color: #f8fafc;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #64748b;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .detail-value {
            font-size: 0.85rem;
            color: #0f172a;
            font-weight: 600;
        }

        /* Card Footer */
        .card-footer {
            padding: 14px 20px;
            background-color: #f8fafc;
            border-top: 1px solid #e2e8f0;
            text-align: center;
            font-size: 0.7rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <main class="card-container">
        <!-- Organization Header -->
        <header class="card-header">
            <!-- Replace with an <img> tag for an organization logo if needed -->
            <img src="logo.png" alt="logo">
            <h1 class="header-title">Demo Organization</h1>
            <p class="header-subtitle">Member Information Record</p>
        </header>

        <!-- Profile Details -->
        <section class="card-body">
            <div class="photo-wrapper">
                <!-- Replace 'src' with your profile image path (e.g., avatar.png) -->
                <img 
                    src="Professional passport-style portrait.png" 
                    alt="Profile Photo" 
                    class="profile-photo"
                >
                <span class="status-badge">Active</span>
            </div>

            <h2 class="person-name">Alex Morgan</h2>
            <p class="person-role">Undergraduate Member</p>

            <!-- Key-Value Information Grid -->
            <div class="details-grid">
                <div class="detail-item">
                    <span class="detail-label">Member ID</span>
                    <span class="detail-value">98234102</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Department</span>
                    <span class="detail-value">Informatics</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Academic Year</span>
                    <span class="detail-value">2025 – 2026</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Status</span>
                    <span class="detail-value">Enrolled</span>
                </div>
            </div>
        </section>

        <!-- Footer Notice -->
        <footer class="card-footer">
            &copy; 2026 Demo Portal &bull; Internal Reference Only
        </footer>
    </main>

</body>
</html>
